name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Same gate as local development: gofmt check, golangci-lint (zero
    # issues), go build + go vet, tests with the 80% coverage threshold.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: make check
        run: make check
      - name: Fixtures are reproducible
        run: make fixtures && git diff --exit-code testdata/
      - name: Offline demo
        run: make demo
      - name: Held-out evaluation
        run: make eval
